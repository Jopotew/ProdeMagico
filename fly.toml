app = "prode-staging"
primary_region = "gig"

[build]

[env]
  PHX_HOST = "prode-staging.fly.dev"
  PORT = "8080"
  ECTO_IPV6 = "true"
  POOL_SIZE = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = "/app/bin/prode eval \"Prode.Release.migrate()\""
